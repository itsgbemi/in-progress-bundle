[build]
command = "npm run build"
publish = "dist"

# Single Page Application (SPA) routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Security Headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
